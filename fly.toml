# fly.toml app configuration file for wiki-race
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = 'wiki-race'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # Scales to zero when idle and wakes on the next request, so an app nobody is playing
  # costs nothing. An open Socket.IO connection counts as activity, so a live round is
  # never cut short by the machine stopping.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

# IMPORTANT: exactly one machine. Room state lives in server memory, so a second instance
# would serve players a different set of rooms — they would join a code that, to them,
# does not exist. Do not scale this horizontally without moving rooms out of process.
[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
